<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background-color: #11120D;">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="ogAura" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#565449" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#11120D" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#11120D" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#11120D" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Brand Mark Gradients -->
    <linearGradient id="ogGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#D9D5C7" />
      <stop offset="100%" stop-color="#9A9483" />
    </linearGradient>
    <linearGradient id="ogSlashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFF5D6" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8CFBC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#565449" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="#11120D" />
  <rect width="1200" height="630" fill="url(#ogAura)" />
  <rect width="1200" height="630" fill="url(#goldGlow)" />

  <!-- Subtle Architectural Grid Pattern -->
  <g stroke="rgba(216, 207, 188, 0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Outer Architectural Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Studio Status Pill -->
  <g transform="translate(480, 85)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="rgba(86, 84, 73, 0.35)" stroke="rgba(216, 207, 188, 0.2)" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#D4AF37" />
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#D8CFBC">INDEPENDENT STUDIO</text>
  </g>

  <!-- Geometric Brand Glyph -->
  <g transform="translate(565, 150) scale(1.4)">
    <path d="M 32 8 L 58 56 L 45 56 L 38 43 L 26 43 L 19 56 L 6 56 Z" fill="url(#ogGoldGrad)" />
    <polygon points="32,21 36,31 28,31" fill="#0A0A0A" />
    <path d="M 37 40 L 54 61 L 47 62 L 32 45 Z" fill="url(#ogSlashGrad)" />
  </g>

  <!-- Main Headline Typography -->
  <text x="600" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Syne', 'Inter', sans-serif" font-size="54" font-weight="900" letter-spacing="4" fill="#FFFBF4">AUVYQ DIGITAL</text>
  <text x="600" y="335" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="7" fill="#D4AF37">DIGITAL, REIMAGINED.</text>

  <!-- Description / Core Disciplines -->
  <text x="600" y="395" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#D8CFBC">Websites that make your business look bigger.</text>
  <text x="600" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="400" fill="rgba(216, 207, 188, 0.75)">
    Bespoke Web Architecture · Hotel Booking Platforms · 3D Signage · Paid Ads &amp; WhatsApp Growth
  </text>

  <!-- Bottom Metric & Contact Bar -->
  <g transform="translate(100, 480)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(216, 207, 188, 0.12)" stroke-width="1" />
    
    <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFBF4">INVESTMENT: ₹10k–50k</text>
    <text x="50" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="rgba(216, 207, 188, 0.6)">Transparent Fixed Pricing</text>

    <text x="500" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFBF4">SPEED: &lt; 0.8s CORE VITALS</text>
    <text x="500" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="rgba(216, 207, 188, 0.6)">Zero Bloated Templates</text>

    <text x="950" y="42" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFBF4">WHATSAPP: +91 6206242488</text>
    <text x="950" y="60" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="rgba(216, 207, 188, 0.6)">Direct Engineering Desk</text>
  </g>
</svg>
